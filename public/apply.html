<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F6F4">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <title>Kirim CV Anda</title>
  <link rel="preload" href="/fonts/geist-v5-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/geist-mono-v6-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/brand.js" defer></script>
  <script src="/upload.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <img class="mark" src="/logo.png" alt="" width="40" height="40">
      <span class="brand-text">
        <strong data-company>Karir</strong>
        <small class="mono">Karir</small>
      </span>
    </a>
    <a class="button dark" id="site-link" hidden><span class="wide-only">Kunjungi situs</span><span class="narrow-only">Situs</span> <span aria-hidden="true">→</span></a>
  </header>
  <main class="card">
    <a class="back" href="/">← Semua lowongan</a>
    <header>
      <h1>Kirim CV Anda</h1>
      <p class="muted" id="position-banner" hidden>Melamar untuk <strong id="position-label"></strong></p>
    </header>

    <form id="cv-form" novalidate>
      <label>
        <span class="label-text">Nama lengkap <span class="req">*</span></span>
        <input name="name" autocomplete="name" maxlength="100" required>
        <small class="error" data-for="name"></small>
      </label>

      <label>
        <span class="label-text">Email <span class="req">*</span></span>
        <input name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required>
        <small class="error" data-for="email"></small>
      </label>

      <label>
        <span class="label-text">Nomor WA/HP <span class="req">*</span></span>
        <input name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="30" placeholder="0812-3456-7890" aria-describedby="phone-hint" required>
        <small class="hint" id="phone-hint">Nomor HP yang aktif di WhatsApp</small>
        <small class="error" data-for="phone"></small>
      </label>

      <label>
        <span class="label-text">Instagram / LinkedIn (opsional)</span>
        <input name="social" maxlength="200" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="misalnya @namaanda">
        <small class="error" data-for="social"></small>
      </label>

      <label id="position-field">
        <span class="label-text">Posisi yang dilamar <span class="req" id="position-req" hidden>*</span></span>
        <!-- Becomes a dropdown when open positions are configured; stays free text otherwise. -->
        <input name="position" maxlength="100">
        <small class="error" data-for="position"></small>
      </label>

      <label id="other-field" hidden>
        <span class="label-text">Posisi apa yang Anda cari?</span>
        <input name="position_other" maxlength="100" placeholder="misalnya admin, gudang, apa saja yang sesuai">
        <small class="error" data-for="position_other"></small>
      </label>

      <!-- Honeypot for bots: hidden from people and screen readers -->
      <div class="hp" aria-hidden="true">
        <label>Website <input name="website" tabindex="-1" autocomplete="off"></label>
      </div>

      <div class="file-field">
        <span class="label-text">CV / Resume <span class="req">*</span></span>
        <label class="dropzone" id="dropzone">
          <input name="cv" id="cv" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
          <span id="file-name">Ketuk untuk memilih file</span>
          <small class="muted" id="file-hint">PDF, DOC, atau DOCX</small>
        </label>
        <small class="error" data-for="cv"></small>
      </div>

      <label class="check">
        <input type="checkbox" name="consent" required>
        <span id="consent-text">Saya setuju CV dan data kontak saya disimpan dan digunakan untuk keperluan rekrutmen.</span>
      </label>
      <small class="error" data-for="consent"></small>

      <div class="progress" id="progress" hidden><div class="bar" id="bar"></div></div>
      <p class="error form-error" id="form-error" role="alert"></p>

      <button type="submit" id="submit">Kirim CV</button>
    </form>

    <section id="success" hidden>
      <div class="tick" aria-hidden="true">✓</div>
      <h2>Terima kasih!</h2>
      <p>CV Anda sudah kami terima. Kami akan menghubungi Anda jika profil Anda sesuai dengan lowongan yang tersedia.</p>
      <button type="button" class="secondary" id="again">Kirim CV lain</button>
    </section>
  </main>
  <footer class="site-footer mono">© <span id="year"></span> <span data-company></span></footer>
</body>
</html>
